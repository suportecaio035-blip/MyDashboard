<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-shield-halved logo-icon"></i>
            <h1>Arquivo de<span>Senhas</span></h1>
        </div>
        <h2>Ghost<span>Wire</span></h2>
    </nav>
    
    
    <label for="fileInput" class="import">
        <i class="fa-solid fa-lock logo-icon"></i>
        <input type="file" id="fileInput" accept="application/json">
    </label>

    <h1>Escolha seu<span>Arquivo</span></h1>
    <input type="text" id="texto" placeholder="Pesquise pelo nome do site ou serviço">

    <div class="container_password" id="container_password">
        <!-- Cards generated from JSON will appear here -->
        <p class="hint">Escolha um arquivo JSON com a lista de contas para gerar os cartões.</p>
    </div>





    <script src="js/scripts.js"></script>
    <script src="https://kit.fontawesome.com/32e6ef9466.js" crossorigin="anonymous"></script>
</body>

</html>
